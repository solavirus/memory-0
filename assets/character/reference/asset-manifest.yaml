version: 0.1
character:
  name: creator-avatar
  role: creator internet spokesperson
  mandatory_references:
    - reference/character-base.svg
    - reference/character-poses.svg
  optional_references:
    - reference/helper-robot.svg
  fixed_features:
    - white circular head
    - black simple stick/brush body
    - bright blue triangular hat
    - one orange star
  palette:
    ink: "#111111"
    blue: "#149BFF"
    orange: "#FF6A00"
    paper: "#F7F4EC"
    gray: "#8B8B8B"

visual_style:
  mandatory_reference:
    - reference/minimal-page-layout.svg
  principles:
    - one page = one story beat
    - one main scene
    - few elements
    - lots of whitespace
    - hand-drawn rough line
    - very limited color
  normal_limits:
    main_characters: 2
    speech_bubbles: 2
    main_props: 1
    decorative_props: 0

generation:
  prompt_template: ../PROMPT_TEMPLATE.md
  qa_checklist: ../VISUAL_QA.md
  skill: ../../.claude/skills/minimal-character-comic/SKILL.md

reference_policy:
  promote_generated_output_only_after_human_approval: true
  never_treat_every_generated_output_as_a_style_reference: true
