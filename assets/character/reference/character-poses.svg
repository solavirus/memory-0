<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1100" role="img" aria-label="Character pose vocabulary">
  <defs>
    <g id="headhat">
      <path d="M-95 -55 L0 -215 L95 -55 Z" fill="none" stroke="#149BFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-102 -53 Q0 -62 103 -52" fill="none" stroke="#149BFF" stroke-width="16" stroke-linecap="round"/>
      <path d="M0 -160 L12 -132 L43 -130 L19 -111 L27 -80 L0 -96 L-27 -80 L-19 -111 L-43 -130 L-12 -132 Z" fill="#FF6A00"/>
      <circle cx="0" cy="18" r="64" fill="#fff" stroke="#111" stroke-width="15"/>
    </g>
  </defs>
  <rect width="1200" height="1100" fill="#F7F4EC"/>
  <!-- neutral -->
  <g transform="translate(180 300)" stroke="#111" stroke-width="22" fill="none" stroke-linecap="round">
    <use href="#headhat"/>
    <path d="M0 85 L0 265 M0 125 L-70 195 M0 125 L70 195 M0 260 L-48 365 M0 260 L48 365"/>
  </g>
  <!-- thinking -->
  <g transform="translate(600 300)" stroke="#111" stroke-width="22" fill="none" stroke-linecap="round">
