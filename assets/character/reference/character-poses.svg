    <path d="M0 85 L0 265 M0 130 L-65 205 M0 132 L60 82 M60 82 L76 38 M0 260 L-48 365 M0 260 L48 365"/>
  </g>
  <!-- pointing -->
  <g transform="translate(1010 300)" stroke="#111" stroke-width="22" fill="none" stroke-linecap="round">
    <use href="#headhat"/>
    <path d="M0 85 L0 265 M0 130 L-65 205 M0 130 L92 110 M92 110 L126 82 M0 260 L-48 365 M0 260 L48 365"/>
  </g>
  <!-- surprised -->
  <g transform="translate(180 760)" stroke="#111" stroke-width="22" fill="none" stroke-linecap="round">
    <use href="#headhat"/>
    <path d="M0 85 L12 255 M5 125 L-82 85 M8 125 L88 72 M12 250 L-28 356 M12 250 L68 345"/>
    <path d="M116 -110 l24 -18 M124 -72 l30 2" stroke="#149BFF" stroke-width="10"/>
  </g>
  <!-- wave -->
  <g transform="translate(600 760)" stroke="#111" stroke-width="22" fill="none" stroke-linecap="round">
    <use href="#headhat"/>
    <path d="M0 85 L0 265 M0 130 L-65 205 M0 130 L70 58 M70 58 L83 0 M0 260 L-48 365 M0 260 L48 365"/>
  </g>
  <!-- celebrate -->
  <g transform="translate(1010 760)" stroke="#111" stroke-width="22" fill="none" stroke-linecap="round">
    <use href="#headhat"/>
    <path d="M0 85 L0 265 M0 130 L-70 70 M0 130 L70 70 M0 260 L-48 365 M0 260 L48 365"/>
    <path d="M-122 -112 l-25 -20 M-126 -72 l-32 0 M122 -112 l25 -20 M126 -72 l32 0" stroke="#FF6A00" stroke-width="10"/>
