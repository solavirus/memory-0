<!doctype html>

<body>
<nav>
  <a href="/">Today</a>

<h1>内部管线追踪（开发者视图）</h1>
<p class="muted">
  Incoming Event → Episode Formation → Memory Formation → Interpretation →
  Belief/Behavior Update → Self Model Change。原始表数据，供检查因果链是否真的完整。
</p>
<div id="trace"></div>

<script src="/nav.js"></script>
<script>
async function load() {
  const res = await fetch("/api/debug/trace");
  const data = await res.json();
  const el = document.getElementById("trace");
  for (const [table, rows] of Object.entries(data)) {
    const div = document.createElement("div");
    div.innerHTML = `<h2>${table} (${rows.length})</h2><pre>${JSON.stringify(rows, null, 2)}</pre>`;
    el.appendChild(div);
  }
}
load();
</script>
</body>
</html>
